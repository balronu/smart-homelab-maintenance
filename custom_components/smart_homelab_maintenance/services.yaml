check:
  name: Check
  description: Read the current agent health and capabilities.
  fields:
    entry_id:
      name: Config entry
      description: Optional config entry ID.
      required: false
      selector:
        text:
get_job:
  name: Get job
  description: Read one persisted job.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    job_id:
      name: Job ID
      required: true
      selector:
        text:
get_job_events:
  name: Get job events
  description: Read a bounded page of job events.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    job_id:
      name: Job ID
      required: true
      selector:
        text:
    after:
      name: Cursor
      required: false
      default: 0
      selector:
        number:
          min: 0
          mode: box
dry_run:
  name: Simulate update
  description: Run the fixed, read-only package-manager simulation for one authorized target.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    target:
      name: Authorized target
      description: host or container VMID, for example container:107.
      required: true
      selector:
        text:
    confirm:
      name: Explicit confirmation
      description: Required acknowledgement that this is a read-only simulation.
      required: true
      selector:
        boolean:
execute:
  name: Install authorized updates
  description: Run apt update and a no-remove apt upgrade for one explicitly authorized running LXC.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    target:
      name: Update target
      description: Numeric target, for example container:107. VMs and the host are rejected.
      required: true
      selector:
        text:
    confirm:
      name: Explicit confirmation
      description: Required acknowledgement before the real package update.
      required: true
      selector:
        boolean:
    plan_digest:
      name: Update plan digest
      description: Fresh plan identifier returned by the update check.
      required: true
      selector:
        text:
    attempt_id:
      name: Installation attempt identity
      description: Stable identity reused for retries of this explicit confirmation.
      required: false
      selector:
        text:
    install_confirmed:
      name: Confirm installation separately
      description: Required second confirmation that packages may actually be installed.
      required: true
      selector:
        boolean:
set_permissions:
  name: Set LXC permissions
  description: Explicitly grant or revoke simulation and real-update permissions for one running LXC.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    target:
      name: LXC target
      description: Numeric target, for example container:110. VMs and the host are rejected.
      required: true
      selector:
        text:
    simulation_authorized:
      name: Allow simulation
      required: true
      selector:
        boolean:
    update_authorized:
      name: Allow real updates
      description: Requires simulation authorization and remains subject to execution_enabled.
      required: true
      selector:
        boolean:
    confirm:
      name: Explicit confirmation
      required: true
      selector:
        boolean:

policy_prepare:
  name: Prepare orchestration policy
  description: Validate a discover-only or auto-eligible policy candidate without changing the agent or guests.
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - discover_only
            - auto_eligible
    generation:
      required: true
      selector:
        number:
          min: 0
          mode: box
    manual_authorized_ids:
      required: false
      selector:
        object: {}

policy_apply:
  name: Apply orchestration policy
  description: Apply a prepared policy only with the current generation and explicit confirmation.
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - discover_only
            - auto_eligible
    generation:
      required: true
      selector:
        number:
          min: 0
          mode: box
    confirm:
      required: true
      selector:
        boolean: {}
    manual_authorized_ids:
      required: false
      selector:
        object: {}

orchestration_preview:
  name: Preview LXC eligibility
  description: Explicitly probe eligible running LXC containers and return a non-writing plan.
  fields: {}

orchestration_apply:
  name: Apply LXC eligibility plan
  description: Apply an unchanged preview plan only after explicit confirmation.
  fields:
    preview_token:
      required: true
      selector:
        text: {}
    confirm:
      required: true
      selector:
        boolean: {}
