check:
  name: Check
  description: Read the current agent health and capabilities.
  fields:
    entry_id:
      name: Config entry
      description: Optional config entry ID.
      required: false
      selector:
        text:
get_job:
  name: Get job
  description: Read one persisted job.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    job_id:
      name: Job ID
      required: true
      selector:
        text:
get_job_events:
  name: Get job events
  description: Read a bounded page of job events.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    job_id:
      name: Job ID
      required: true
      selector:
        text:
    after:
      name: Cursor
      required: false
      default: 0
      selector:
        number:
          min: 0
          mode: box
dry_run:
  name: Simulate update
  description: Run the fixed, read-only package-manager simulation for one authorized target.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    target:
      name: Authorized target
      description: host or container VMID, for example container:107.
      required: true
      selector:
        text:
    confirm:
      name: Explicit confirmation
      description: Required acknowledgement that this is a read-only simulation.
      required: true
      selector:
        boolean:
execute:
  name: Install authorized updates
  description: Run apt update and a no-remove apt upgrade for one explicitly authorized running LXC.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    target:
      name: Update target
      description: Numeric target, for example container:107. VMs and the host are rejected.
      required: true
      selector:
        text:
    confirm:
      name: Explicit confirmation
      description: Required acknowledgement before the real package update.
      required: true
      selector:
        boolean:
    plan_digest:
      name: Update plan digest
      description: Fresh plan identifier returned by the update check.
      required: true
      selector:
        text:
set_permissions:
  name: Set LXC permissions
  description: Explicitly grant or revoke simulation and real-update permissions for one running LXC.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    target:
      name: LXC target
      description: Numeric target, for example container:110. VMs and the host are rejected.
      required: true
      selector:
        text:
    simulation_authorized:
      name: Allow simulation
      required: true
      selector:
        boolean:
    update_authorized:
      name: Allow real updates
      description: Requires simulation authorization and remains subject to execution_enabled.
      required: true
      selector:
        boolean:
    confirm:
      name: Explicit confirmation
      required: true
      selector:
        boolean:
