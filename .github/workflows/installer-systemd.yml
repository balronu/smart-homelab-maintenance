name: Installer systemd acceptance

on:
  push:
  pull_request:

jobs:
  installer-root-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Real root/systemd installer acceptance on ephemeral runner
        run: sudo scripts/test-lxc-helper-installer-systemd.sh
      - name: Real isolated package install acceptance
        run: sudo scripts/test-isolated-package-install.sh
