name: Offline validation

on:
  push:
  pull_request:

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python tests and compile
        run: |
          python -m pip install "pytest==9.0.3" "pytest-asyncio==1.4.0"
          PYTHONPATH=. python -m pytest -q tests/test_core.py
          python -m compileall -q agent custom_components tests
      - name: Frontend state tests
        run: node frontend/card-state.test.js
      - name: JSON validation
        run: |
          python -m json.tool custom_components/smart_homelab_maintenance/manifest.json >/dev/null
          python -m json.tool custom_components/smart_homelab_maintenance/strings.json >/dev/null
          python -m json.tool custom_components/smart_homelab_maintenance/translations/de.json >/dev/null
          python -m json.tool custom_components/smart_homelab_maintenance/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
  frontend-contract:
    runs-on: ubuntu-latest
    needs: python-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lovelace syntax, state and registration contracts
        run: |
          node --check frontend/card-state.js
          node --check frontend/smart-homelab-maintenance-card.js
          node frontend/card-state.test.js
          cmp frontend/smart-homelab-maintenance-card.js custom_components/smart_homelab_maintenance/frontend/smart-homelab-maintenance-card.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/smart_homelab_maintenance/manifest.json').read_text())
          assert manifest['version'] == '0.1.0-beta.5'
          init = Path('custom_components/smart_homelab_maintenance/__init__.py').read_text()
          assert 'StaticPathConfig' in init and 'add_extra_js_url' in init
          card = Path('custom_components/smart_homelab_maintenance/frontend/smart-homelab-maintenance-card.js').read_text()
          assert 'type: "smart-homelab-maintenance-card"' in card
          assert 'getConfigElement' in card and 'getStubConfig' in card
          PY
  api-contract:
    runs-on: ubuntu-latest
    needs: python-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: API and transport contract
        run: PYTHONPATH=. python -m unittest tests.test_core.CoreTests.test_http_transport_uses_timeout_size_and_api_version_guards tests.test_core.CoreTests.test_api_job_events_use_cursor_and_survive_reopen -v
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secret and live-reference scan
        run: |
          ! grep -RInE '192\.168\.|10\.[0-9]+\.|172\.(1[6-9]|2[0-9]|3[01])\.|gho_|github_pat_|password[[:space:]]*=' --exclude-dir=.git --exclude-dir=.github .
          ! grep -RInE 'os\.system|Popen|subprocess|0\.0\.0\.0|fetch\(|XMLHttpRequest' agent custom_components frontend tests
  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned Home Assistant runtime
        run: |
          python -m pip install "homeassistant==2026.11.0" "pytest==9.0.3" "pytest-asyncio==1.4.0"
      - name: Import integration and compile checks
        run: |
          python -c "import homeassistant; print('homeassistant import ok')"
          python -c "import custom_components.smart_homelab_maintenance as integration; print(integration.PLATFORMS)"
          python -m compileall -q custom_components
  ha-runtime-tests:
    runs-on: ubuntu-latest
    needs: ha-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned Home Assistant runtime
        run: |
          python -m pip install "homeassistant==2026.11.0" "pytest==9.0.3" "pytest-asyncio==1.4.0"
      - name: Run actual HA flow, registry, service and diagnostics tests
        env:
          PYTHONPATH: .
        run: python -c 'import homeassistant; import pytest; raise SystemExit(pytest.main(["-q", "tests/ha_runtime_tests.py"]))'
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS structure for private repository
        run: |
          python -m json.tool hacs.json >/dev/null
          test -f custom_components/smart_homelab_maintenance/manifest.json
          test -f custom_components/smart_homelab_maintenance/translations/de.json
          test -f custom_components/smart_homelab_maintenance/translations/en.json
          test "$(python -c 'import json; print(json.load(open("hacs.json"))["content_in_root"])')" = "False"
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser matrix
        run: node frontend/playwright-harness.mjs
      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-browser-matrix
          path: /tmp/card-*.png
          if-no-files-found: error
