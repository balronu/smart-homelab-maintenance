<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>job status harness</title></head>
<body><smart-homelab-maintenance-card id="card"></smart-homelab-maintenance-card><pre id="result"></pre><script type="module" src="./smart-homelab-maintenance-card.js"></script>
<script type="module">
const card = document.querySelector("#card");
const base = (job = null) => ({
  "sensor.smart_homelab_maintenance_agent_connection": { state: "connected", attributes: {} },
  "binary_sensor.smart_homelab_maintenance_agent_reachable": { state: "on", attributes: {} },
  "sensor.smart_homelab_maintenance_container_101": { state: "running", attributes: { container_id: 101, name: "ct101", running: true, os_name: "Debian", os_version: "13", package_manager: "apt", update: { status: "updates_available", dry_run_supported: true, update_supported: true, execution_enabled: true, backend_connected: true, fresh: true, simulation_authorized: true, update_authorized: true, plan_digest: "plan-101", packages: [{ name: "curl", installed_version: "1", available_version: "2" }] } } },
  "sensor.smart_homelab_maintenance_running_jobs": { state: job ? "1" : "0", attributes: { jobs: job ? [job] : [] } },
});
card.setConfig({ show_vms: false, show_containers: true });
let executeCalls = 0; let getJobCalls = 0; let phase = "running";
const acceptedJob = { job_id: "job-active-101", target: "container:101", state: "preflight", phase: "preflight", message: "update job accepted", created_at: "2026-11-13T14:00:00Z", started_at: "2026-11-13T14:00:00Z" };
const runningJob = { ...acceptedJob, state: "running", phase: "execution", message: "APT update started", last_activity_at: "2026-11-13T14:00:02Z" };
const successfulJob = { ...runningJob, state: "succeeded", phase: "complete", message: "fixed APT update completed", finished_at: "2026-11-13T14:01:00Z", last_activity_at: "2026-11-13T14:01:00Z" };
card.hass = { language: "en", states: base(), callService: (domain, service) => { if (service === "dry_run") return Promise.resolve({ response: { data: { success: true, safe: true, plan_digest: "plan-101", packages: [{ name: "curl", installed_version: "1", available_version: "2" }] } } }); if (service === "execute") { executeCalls += 1; return Promise.resolve({ response: { data: { success: true, accepted: true, job_id: acceptedJob.job_id, status: "running", message: "update job accepted" } } }); } if (service === "get_job") { getJobCalls += 1; return Promise.resolve({ response: { data: phase === "running" ? runningJob : successfulJob } }); } return Promise.resolve({ response: { data: { success: true } } }); } };
const simulate = card.shadowRoot.querySelector(".container-grid .simulate"); simulate.click(); await new Promise((resolve) => setTimeout(resolve, 20)); card.render(); await new Promise((resolve) => setTimeout(resolve, 0));
const install = card.shadowRoot.querySelector(".container-grid .install"); window.confirm = () => true; install.click(); install.click(); await new Promise((resolve) => setTimeout(resolve, 0));
const acceptedText = card.shadowRoot.textContent; const acceptedIsNotSuccess = acceptedText.includes("Update accepted; job is being tracked") && !acceptedText.includes("Update completed successfully"); const doubleClickBlocked = executeCalls === 1;
const progressButton = [...card.shadowRoot.querySelectorAll(".job-actions button")].find((button) => button.textContent.includes("Show progress")); progressButton?.click(); await new Promise((resolve) => setTimeout(resolve, 20));
const detailVisible = card.shadowRoot.textContent.includes("Job ID") && card.shadowRoot.textContent.includes("container:101") && card.shadowRoot.textContent.includes("execution") && getJobCalls >= 1;
phase = "success"; const terminalButton = [...card.shadowRoot.querySelectorAll(".job-actions button")].find((button) => button.textContent.includes("Show progress")); terminalButton?.click(); await new Promise((resolve) => setTimeout(resolve, 20)); const successAfterTerminal = card.shadowRoot.textContent.includes("Completed successfully");
const historical = { job_id: "0a36ae20-2397-460c-8445-3bc2120f0790", target: "container:101", state: "reconciled_legacy_state_verified", phase: "recovery", message: "legacy execution unclear", created_at: "2026-11-13T14:03:01Z", finished_at: "2026-11-13T14:03:14Z", last_activity_at: "2026-11-13T14:03:14Z" };
card.hass = { language: "en", states: base(historical) }; const historicalButton = [...card.shadowRoot.querySelectorAll(".job-actions button")].find((button) => button.textContent.includes("Show details")); const historicalLabel = Boolean(historicalButton); historicalButton?.click(); await new Promise((resolve) => setTimeout(resolve, 0)); const historicalDetail = card.shadowRoot.textContent.includes("Historical state verified; execution remains unclear");
const blocked = { ...historical, state: "blocked", message: "read-only preflight failed; no package update was started" }; card.hass = { language: "en", states: base(blocked) }; const blockedButton = [...card.shadowRoot.querySelectorAll(".job-actions button")].find((button) => button.textContent.includes("Show details")); blockedButton?.click(); await new Promise((resolve) => setTimeout(resolve, 0)); const blockedDetail = card.shadowRoot.textContent.includes("read-only preflight failed");
const unknownCard = document.createElement("smart-homelab-maintenance-card"); document.body.append(unknownCard); unknownCard.setConfig({ show_vms: false, show_containers: true }); unknownCard.hass = { language: "en", states: base(acceptedJob), callService: (domain, service) => service === "get_job" ? Promise.reject(new Error("job endpoint unavailable")) : Promise.resolve({ response: { data: { success: true } } }) }; const unknownButton = unknownCard.shadowRoot.querySelector(".job-actions button"); unknownButton?.click(); await new Promise((resolve) => setTimeout(resolve, 0)); const unknownVisible = unknownCard.shadowRoot.textContent.includes("job endpoint unavailable");
window.__JOB_HARNESS__ = { acceptedIsNotSuccess, doubleClickBlocked, detailVisible, successAfterTerminal, historicalLabel, historicalDetail, blockedDetail, unknownVisible }; document.querySelector("#result").textContent = JSON.stringify(window.__JOB_HARNESS__);
</script></body></html>
