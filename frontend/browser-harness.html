<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>offline card harness</title></head>
<body style="margin:0;max-width:100vw;overflow-x:hidden"><style>pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><smart-homelab-maintenance-card id="card"></smart-homelab-maintenance-card><pre id="result"></pre>
<script type="module">
import "./smart-homelab-maintenance-card.js";
const card = document.querySelector("#card");
card.setConfig({ title: "Harness", data_entity: "sensor.mock", show_jobs: true, show_resources: true });
card.hass = { locale: "en", states: { "sensor.mock": { state: "connected", attributes: {
  connected: true, available_updates: 1, blocked_updates: 1,
  containers: [{ container_id: 101, name: "cloudflared", running: true, os_name: "Debian", os_version: "12", applications: [{ app_id: "unknown", installed_version: null, update_supported: false, blocked_reasons: ["unsupported"] }] }],
  jobs: [{ job_id: "job-1", target: "paperless", state: "running", phase: "execution", message: "fixture" }]
} } } };
window.__HARNESS__ = { connected: card.shadowRoot.querySelector(".status").textContent.includes("Connected"), hasContainer: card.shadowRoot.textContent.includes("cloudflared"), hasPhaseOnlyJob: card.shadowRoot.textContent.includes("Phase: execution"), hasHorizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth };
document.querySelector("#result").textContent = JSON.stringify(window.__HARNESS__);
</script></body></html>
