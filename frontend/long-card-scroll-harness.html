<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Long card scroll fixture — simulated layouts, not HA runtime</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui;background:#eee}
#dashboard{padding:12px;min-width:0}
#dashboard.sections{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
#dashboard.masonry{display:block}
smart-homelab-maintenance-card{min-width:0}
#after{height:140px;background:#ddd;margin-top:12px;padding:12px}
</style>
<div style="height:120px">Before card</div>
<main id="dashboard"><smart-homelab-maintenance-card></smart-homelab-maintenance-card><div id="after">AFTER_CARD_SENTINEL</div></main>
<script type="module">
import "./smart-homelab-maintenance-card.js";
const card=document.querySelector("smart-homelab-maintenance-card");
card.setConfig({title:"Long container test",show_containers:true,show_vms:true});
const states={
 "sensor.smart_homelab_maintenance_agent_connection":{state:"connected",attributes:{}},
 "binary_sensor.smart_homelab_maintenance_agent_reachable":{state:"on",attributes:{}},
 "sensor.smart_homelab_maintenance_host":{state:"pve-test",attributes:{online:true}},
 "sensor.smart_homelab_maintenance_running_jobs":{state:"0",attributes:{}},
};
const count=Math.max(0,Math.min(50,Number(new URLSearchParams(location.search).get("count") ?? 16)||0));
for(let offset=0;offset<count;offset++){const id=100+offset; states[`sensor.smart_homelab_maintenance_container_${id}`]={state:offset%3===0?"stopped":"running",attributes:{container_id:id,name:`Container ${id} with a deliberately long name`,running:offset%3!==0,memory_used_bytes:512*1024*1024,memory_total_bytes:1024*1024*1024,disk_used_bytes:1024*1024*1024,disk_total_bytes:2048*1024*1024,os_name:"Debian",os_version:"12"}};}
card.hass={language:"de",states};
window.__FIXTURE_READY__=true;
</script></html>
